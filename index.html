<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAE 隨機抽籤系統</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      background-color: #0f172a;
      font-family: "Segoe UI", "Microsoft JhengHei", Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 800px;
      box-sizing: border-box;
      background-color: #1e293b;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .mute-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      z-index: 20;
      background: rgba(15, 23, 42, 0.75);
      color: white;
      border: 1px solid #475569;
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 14px;
      cursor: pointer;
    }

    /* 舞台：背景圖 + 四張人物頭像（flex 平均排列） */
    .stage {
      width: 100%;
      height: 260px;
      box-sizing: border-box;
      background-image: url('bg.png');
      background-size: cover;
      background-position: center;
      border-radius: 12px;
      border: 4px solid #334155;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      overflow: hidden;
    }

    .character {
      width: 21%;
      aspect-ratio: 210 / 232;
      object-fit: cover;
      border: 3px solid #0f172a;
      border-radius: 10px;
      image-rendering: pixelated;
      transition: filter 0.3s ease, transform 0.3s ease, opacity 0.4s ease;
    }

    /* 尚未抽籤：大頭先隱藏，按下開始後依序彈出 */
    .character:not(.show) {
      opacity: 0;
      transform: scale(0.6) translateY(24px);
      pointer-events: none;
    }

    .dimmed {
      filter: brightness(0.3) grayscale(60%);
      transform: scale(0.95);
    }

    .highlight {
      filter: brightness(1.1) drop-shadow(0 0 15px rgba(255, 215, 0, 0.8));
      transform: scale(1.05);
      z-index: 10;
    }

    .win-animation {
      animation: jumpAndWiggle 0.6s ease-in-out infinite;
      filter: brightness(1.2) drop-shadow(0 0 20px rgba(255, 255, 0, 1));
      z-index: 10;
    }

    @keyframes jumpAndWiggle {
      0%, 100% { transform: translateY(0) scale(1.05) rotate(0deg); }
      25% { transform: translateY(-12px) scale(1.05) rotate(-3deg); }
      50% { transform: translateY(0) scale(1.05) rotate(0deg); }
      75% { transform: translateY(-12px) scale(1.05) rotate(3deg); }
    }

    .cards-container {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 32px;
    }

    .card {
      flex: 1;
      background-color: #334155;
      border-radius: 8px;
      padding: 16px 0;
      text-align: center;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }

    .card h2 {
      margin: 0;
      font-size: 32px;
      color: #94a3b8;
    }

    .card p {
      margin: 8px 0 0 0;
      font-size: 14px;
      color: #64748b;
    }

    .card.active {
      background-color: #fef08a;
      border-color: #eab308;
      box-shadow: 0 0 15px rgba(254, 240, 138, 0.5);
    }

    .card.active h2, .card.active p {
      color: #854d0e;
      font-weight: bold;
    }

    .control-panel {
      text-align: center;
    }

    .draw-btn {
      background: linear-gradient(135deg, #a7f3d0, #6ee7b7);
      color: #064e3b;
      border: none;
      padding: 16px 48px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(110, 231, 183, 0.4);
      transition: transform 0.1s, box-shadow 0.1s;
      margin-bottom: 20px;
    }

    .draw-btn:active {
      transform: scale(0.95);
      box-shadow: 0 2px 10px rgba(110, 231, 183, 0.4);
    }

    .draw-btn:disabled {
      background: #475569;
      color: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
    }

    .result-text {
      font-size: 24px;
      font-weight: bold;
      color: #fef08a;
      min-height: 36px;
    }

    .gear-btn {
      position: absolute;
      top: 10px;
      left: 12px;
      z-index: 20;
      background: rgba(15, 23, 42, 0.75);
      color: white;
      border: 1px solid #475569;
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 14px;
      cursor: pointer;
    }
    .gear-btn.on { border-color: #6ee7b7; color: #a7f3d0; }

    .mtbox-status {
      font-size: 14px;
      min-height: 20px;
      margin-top: 8px;
      color: #94a3b8;
    }
    .mtbox-status.ok { color: #6ee7b7; }
    .mtbox-status.err { color: #fca5a5; }

    .mtbox-panel {
      margin-top: 20px;
      padding: 16px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      text-align: left;
    }
    .mtbox-panel[hidden] { display: none; }
    .mtbox-panel h3 { margin: 0 0 4px; font-size: 16px; }
    .mtbox-panel .hint { margin: 0 0 12px; font-size: 12px; color: #94a3b8; line-height: 1.6; }
    .mtbox-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .mtbox-panel label { display: block; font-size: 12px; color: #94a3b8; }
    .mtbox-panel input[type=text], .mtbox-panel input[type=password], .mtbox-panel input[type=number], .mtbox-panel select {
      width: 100%;
      box-sizing: border-box;
      margin-top: 4px;
      padding: 8px 10px;
      font-size: 15px;
      color: white;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 8px;
    }
    .mtbox-map { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
    .mtbox-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 14px; }
    .mtbox-row label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: white; }
    .mtbox-row select { width: auto; margin-top: 0; }
    .mtbox-row button {
      padding: 8px 14px;
      font-size: 14px;
      color: white;
      background: #334155;
      border: 1px solid #475569;
      border-radius: 8px;
      cursor: pointer;
    }
    .mtbox-row button:disabled { opacity: 0.5; cursor: not-allowed; }

    @media (max-width: 560px) {
      .mtbox-grid { grid-template-columns: 1fr; }
      .container { padding: 16px; }
      .stage { height: 180px; }
      .card h2 { font-size: 24px; }
      .card p { font-size: 12px; }
      .result-text { font-size: 20px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <button class="gear-btn" id="gearBtn" title="MTBOX 連動設定">⚙ MTBOX</button>
    <button class="mute-btn" id="muteBtn" title="音效開關">🔊 音效</button>
    <div class="stage">
      <img src="fae1.png" id="char-0" class="character" alt="FAE 1">
      <img src="fae2.png" id="char-1" class="character" alt="FAE 2">
      <img src="fae3.png" id="char-2" class="character" alt="FAE 3">
      <img src="fae4.png" id="char-3" class="character" alt="FAE 4">
    </div>

    <div class="cards-container">
      <div class="card" id="card-0"><h2>1</h2><p>FAE ①</p></div>
      <div class="card" id="card-1"><h2>2</h2><p>FAE ②</p></div>
      <div class="card" id="card-2"><h2>3</h2><p>FAE ③</p></div>
      <div class="card" id="card-3"><h2>4</h2><p>FAE ④</p></div>
    </div>

    <div class="control-panel">
      <button class="draw-btn" id="drawBtn">🎰 開始抽籤</button>
      <div class="result-text" id="resultText">等待抽籤...</div>
      <div class="mtbox-status" id="mtboxStatus"></div>

      <div class="mtbox-panel" id="mtboxPanel" hidden>
        <h3>MTBOX 連動</h3>
        <p class="hint">抽到幾號，就對 MTBOX 送出切換設定檔的 CGI 指令（<code>request=setProfile&amp;profile=N</code>）。IP 與帳密只存在這台裝置的瀏覽器裡；用雲端代理時會隨指令經本站代理轉送給 MTBOX，代理不儲存。</p>
        <div class="mtbox-grid">
          <label>MTBOX IP<input type="text" id="mtHost" placeholder="例：192.168.1.168" autocomplete="off" spellcheck="false"></label>
          <label>帳號<input type="text" id="mtUser" autocomplete="off" spellcheck="false"></label>
          <label>密碼<input type="password" id="mtPass" autocomplete="off"></label>
        </div>
        <div class="mtbox-map">
          <label>抽到 1 → 設定檔<input type="number" id="mtMap0" min="1" max="36" value="1"></label>
          <label>抽到 2 → 設定檔<input type="number" id="mtMap1" min="1" max="36" value="2"></label>
          <label>抽到 3 → 設定檔<input type="number" id="mtMap2" min="1" max="36" value="3"></label>
          <label>抽到 4 → 設定檔<input type="number" id="mtMap3" min="1" max="36" value="4"></label>
        </div>
        <div class="mtbox-row">
          <label><input type="checkbox" id="mtOn"> 抽籤後自動切換</label>
          <label>連線方式
            <select id="mtMode">
              <option value="auto">自動判斷</option>
              <option value="cloud">雲端代理（公網 IP）</option>
              <option value="lan">區網直連（192.168.x.x 等）</option>
            </select>
          </label>
          <button type="button" id="mtTest">測試（送出「抽到 1」的設定檔）</button>
        </div>
        <p class="hint" style="margin:12px 0 0">雲端代理：MTBOX 要有公網 IP，會回報成功或失敗。區網直連：這台裝置要跟 MTBOX 同網段，會跳出一個小視窗送指令後自動關閉，無法回報結果（要允許本站彈出視窗）。</p>
      </div>
    </div>
  </div>

  <script>
    const totalChars = 4;
    let isDrawing = false;
    let revealed = false;

    const chars = Array.from({ length: totalChars }, (_, i) => document.getElementById('char-' + i));
    const cards = Array.from({ length: totalChars }, (_, i) => document.getElementById('card-' + i));
    const drawBtn = document.getElementById('drawBtn');
    const resultText = document.getElementById('resultText');
    const muteBtn = document.getElementById('muteBtn');

    // ===== 音效（Web Audio 合成，不需要音檔；任何錯誤都不會影響抽籤） =====
    let audioCtx = null;
    let muted = false;

    function getCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function tone(freq, when, dur, type, vol) {
      try {
        if (muted) return;
        const c = getCtx();
        const t = c.currentTime + when;
        const o = c.createOscillator();
        const g = c.createGain();
        o.type = type || 'square';
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol || 0.08, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g);
        g.connect(c.destination);
        o.start(t);
        o.stop(t + dur + 0.02);
      } catch (e) { /* 音效失敗就算了 */ }
    }

    const PENTA = [0, 2, 4, 7, 9];                       // 五聲音階
    const note = (semi) => 523.25 * Math.pow(2, semi / 12); // 以 C5 為基準

    // 大頭彈出：上行小音
    function soundPop(i) { tone(note(PENTA[i] + 12), 0, 0.12, 'triangle', 0.1); }

    // 旋轉每一格：音階循環上行，隨著減速自然變慢
    function soundTick(tick) {
      const semi = PENTA[tick % PENTA.length] + (Math.floor(tick / PENTA.length) % 2) * 12;
      tone(note(semi), 0, 0.09, 'square', 0.06);
    }

    // 中獎：小號風格上行琶音 + 和弦
    function soundWin() {
      [0, 4, 7, 12, 16, 19].forEach((s, k) => tone(note(s), k * 0.09, 0.22, 'sawtooth', 0.07));
      [0, 4, 7, 12].forEach((s) => tone(note(s), 0.6, 0.9, 'triangle', 0.09));
    }

    muteBtn.addEventListener('click', () => {
      muted = !muted;
      muteBtn.textContent = muted ? '🔇 靜音' : '🔊 音效';
    });

    // ===== MTBOX 連動：抽到 N 號就送出切換設定檔的 CGI 指令 =====
    // 指令與 mt-camera-control 相同：http://<IP>/request=setProfile&profile=<N>（Basic 帳密）
    const MT_KEY = 'faePickerMtbox';
    const mt = {
      host: document.getElementById('mtHost'),
      user: document.getElementById('mtUser'),
      pass: document.getElementById('mtPass'),
      on: document.getElementById('mtOn'),
      mode: document.getElementById('mtMode'),
      map: [0, 1, 2, 3].map((i) => document.getElementById('mtMap' + i)),
      test: document.getElementById('mtTest'),
      panel: document.getElementById('mtboxPanel'),
      status: document.getElementById('mtboxStatus'),
      gear: document.getElementById('gearBtn'),
    };

    function mtLoad() {
      try {
        const d = JSON.parse(localStorage.getItem(MT_KEY) || '{}');
        mt.host.value = d.host || '';
        mt.user.value = d.user || '';
        mt.pass.value = d.pass || '';
        mt.on.checked = !!d.on;
        mt.mode.value = d.mode || 'auto';
        (d.map || []).forEach((v, i) => { if (mt.map[i] && v) mt.map[i].value = v; });
      } catch (e) { /* 讀不到就用空白 */ }
      mt.gear.classList.toggle('on', mt.on.checked);
    }

    function mtSave() {
      try {
        localStorage.setItem(MT_KEY, JSON.stringify({
          host: mt.host.value.trim(), user: mt.user.value, pass: mt.pass.value,
          on: mt.on.checked, mode: mt.mode.value, map: mt.map.map((el) => el.value),
        }));
      } catch (e) { /* 存不了就只在這次有效 */ }
      mt.gear.classList.toggle('on', mt.on.checked);
    }

    function mtHostClean() {
      return mt.host.value.trim().replace(/^https?:\/\//i, '').replace(/\/+$/, '');
    }

    function mtIsLan(host) {
      const m = host.replace(/:\d+$/, '').match(/^(\d+)\.(\d+)\.\d+\.\d+$/);
      if (!m) return false;
      const a = +m[1], b = +m[2];
      return a === 10 || a === 127 || (a === 192 && b === 168) || (a === 172 && b >= 16 && b <= 31) || (a === 169 && b === 254);
    }

    function mtUseLan() {
      return mt.mode.value === 'lan' || (mt.mode.value === 'auto' && mtIsLan(mtHostClean()));
    }

    function mtProfileFor(n) {
      const p = parseInt(mt.map[n].value, 10);
      return p >= 1 && p <= 36 ? p : n + 1;
    }

    function mtSay(text, cls) {
      mt.status.textContent = text;
      mt.status.className = 'mtbox-status' + (cls ? ' ' + cls : '');
    }

    // 區網直連要靠彈出視窗（https 網頁不能直接連 http 設備），視窗必須在按下按鈕的當下先開好
    function mtPrepare() {
      if (!mtHostClean() || !mtUseLan()) return null;
      try { return window.open('', 'mtbox', 'width=360,height=220'); } catch (e) { return null; }
    }

    async function mtSend(n, win) {
      const host = mtHostClean();
      const profile = mtProfileFor(n);
      if (!host) { if (win) win.close(); mtSay('MTBOX：還沒填 IP', 'err'); return; }

      if (mtUseLan()) {
        if (!win) { mtSay('MTBOX：彈出視窗被擋住了，請允許本站彈出視窗', 'err'); return; }
        const auth = mt.user.value ? encodeURIComponent(mt.user.value) + ':' + encodeURIComponent(mt.pass.value) + '@' : '';
        try {
          win.location.href = 'http://' + auth + host + '/request=setProfile&profile=' + profile;
          setTimeout(() => { try { win.close(); } catch (e) {} }, 2500);
          mtSay('MTBOX：已送出切換設定檔 ' + profile + '（區網直連，無法確認結果）', 'ok');
        } catch (e) { mtSay('MTBOX：送出失敗', 'err'); }
        return;
      }

      mtSay('MTBOX：切換設定檔 ' + profile + ' 中…');
      try {
        const r = await fetch('/api/mtbox', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ host, user: mt.user.value, pass: mt.pass.value, profile }),
        });
        const d = await r.json();
        if (d.ok) mtSay('MTBOX：已切換到設定檔 ' + profile, 'ok');
        else mtSay('MTBOX：切換失敗（' + (d.error || 'HTTP ' + r.status) + '）', 'err');
      } catch (e) {
        mtSay('MTBOX：切換失敗（代理沒有回應）', 'err');
      }
    }

    mt.gear.addEventListener('click', () => { mt.panel.hidden = !mt.panel.hidden; });
    [mt.host, mt.user, mt.pass, mt.on, mt.mode, ...mt.map].forEach((el) => el.addEventListener('change', mtSave));
    mt.test.addEventListener('click', async () => {
      mtSave();
      mt.test.disabled = true;
      await mtSend(0, mtPrepare());
      mt.test.disabled = false;
    });
    mtLoad();

    // 亮起第 n 位（0~3）：卡片亮黃燈、人物發光，其餘變暗
    function light(n) {
      for (let i = 0; i < totalChars; i++) {
        cards[i].classList.toggle('active', i === n);
        chars[i].classList.remove('win-animation');
        chars[i].classList.toggle('highlight', i === n);
        chars[i].classList.toggle('dimmed', i !== n);
      }
    }

    function reset() {
      for (let i = 0; i < totalChars; i++) {
        cards[i].classList.remove('active');
        chars[i].classList.remove('highlight', 'dimmed', 'win-animation');
      }
    }

    function startDraw() {
      if (isDrawing) return;
      isDrawing = true;
      drawBtn.disabled = true;
      drawBtn.textContent = '抽選中…';
      resultText.textContent = '幸運正在降臨！';
      reset();
      mtSay('');
      const mtWin = mt.on.checked ? mtPrepare() : null;

      // 第一次抽籤：四個大頭依序彈出，之後再開始旋轉；再抽一次則不用重播
      let delay = 0;
      if (!revealed) {
        revealed = true;
        chars.forEach((c, i) => setTimeout(() => { c.classList.add('show'); soundPop(i); }, i * 150));
        delay = totalChars * 150 + 350;
      }

      const winner = Math.floor(Math.random() * totalChars); // 0~3
      const total = 20 + winner;   // 讓最後一格剛好停在 winner（20 為 4 的倍數）
      let tick = 0;
      let step = 70;

      function spin() {
        tick++;
        light(tick % totalChars);
        soundTick(tick);

        if (tick < total) {
          step += tick > total - 8 ? 18 : 3;   // 越接近終點越慢
          setTimeout(spin, step);
        } else {
          light(winner);
          chars[winner].classList.remove('highlight');
          chars[winner].classList.add('win-animation');
          soundWin();
          resultText.textContent = '🎉 恭喜！今天是 ' + (winner + 1) + ' 號 FAE！';
          drawBtn.disabled = false;
          drawBtn.textContent = '↻ 再抽一次';
          isDrawing = false;
          if (mt.on.checked) mtSend(winner, mtWin);
        }
      }
      setTimeout(spin, delay);
    }

    drawBtn.addEventListener('click', startDraw);
  </script>
</body>
</html>
