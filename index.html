<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAE 隨機抽籤系統</title>
  <style>
    /* 全局與深色背景設定 */
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a; /* 深藍色背景 */
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: white;
    }

    .container {
      width: 800px;
      background-color: #1e293b;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    /* 舞台區塊 (背景 + 人物) */
    .stage {
      position: relative;
      width: 100%;
      height: 350px;
      background-image: url('bg.png'); /* 使用去背後的 PNG 背景 */
      background-size: cover;
      background-position: center;
      border-radius: 12px;
      overflow: hidden;
      border: 4px solid #334155;
      margin-bottom: 24px;
    }

    /* 人物共同設定 */
    .character {
      position: absolute;
      bottom: -10px;
      height: 280px; 
      transition: filter 0.3s ease, transform 0.3s ease;
      transform-origin: bottom center;
    }

    /* 4個人物的位置 */
    #char-0 { left: 5%; }
    #char-1 { left: 25%; }
    #char-2 { left: 50%; }
    #char-3 { left: 70%; }

    /* 特效 Class */
    .dimmed {
      filter: brightness(0.3) grayscale(60%);
      transform: scale(0.95);
    }

    .highlight {
      filter: brightness(1.1) drop-shadow(0 0 15px rgba(255, 215, 0, 0.8));
      transform: scale(1.05);
      z-index: 10;
    }

    .win-animation {
      animation: jumpAndWiggle 0.6s ease-in-out infinite;
      filter: brightness(1.2) drop-shadow(0 0 20px rgba(255, 255, 0, 1));
      z-index: 10;
    }

    @keyframes jumpAndWiggle {
      0%, 100% { transform: translateY(0) scale(1.05) rotate(0deg); }
      25% { transform: translateY(-20px) scale(1.05) rotate(-3deg); }
      50% { transform: translateY(0) scale(1.05) rotate(0deg); }
      75% { transform: translateY(-20px) scale(1.05) rotate(3deg); }
    }

    /* 下方燈號與卡片區 */
    .cards-container {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 32px;
    }

    .card {
      flex: 1;
      background-color: #334155;
      border-radius: 8px;
      padding: 16px 0;
      text-align: center;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }

    .card h2 {
      margin: 0;
      font-size: 32px;
      color: #94a3b8;
    }

    .card p {
      margin: 8px 0 0 0;
      font-size: 14px;
      color: #64748b;
    }

    /* 卡片亮起狀態 */
    .card.active {
      background-color: #fef08a; /* 黃色亮起 */
      border-color: #eab308;
      box-shadow: 0 0 15px rgba(254, 240, 138, 0.5);
    }

    .card.active h2, .card.active p {
      color: #854d0e; /* 深黃色字體 */
      font-weight: bold;
    }

    /* 控制區 (按鈕與文字) */
    .control-panel {
      text-align: center;
    }

    .draw-btn {
      background: linear-gradient(135deg, #a7f3d0, #6ee7b7);
      color: #064e3b;
      border: none;
      padding: 16px 48px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(110, 231, 183, 0.4);
      transition: transform 0.1s, box-shadow 0.1s;
      margin-bottom: 20px;
    }

    .draw-btn:active {
      transform: scale(0.95);
      box-shadow: 0 2px 10px rgba(110, 231, 183, 0.4);
    }
    
    .draw-btn:disabled {
      background: #475569;
      color: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
    }

    .result-text {
      font-size: 24px;
      font-weight: bold;
      color: #fef08a;
      min-height: 36px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 舞台區 -->
    <div class="stage">
      <img src="fae1.png" id="char-0" class="character" alt="FAE 1">
      <img src="fae2.png" id="char-1" class="character" alt="FAE 2">
      <img src="fae3.png" id="char-2" class="character" alt="FAE 3">
      <img src="fae4.png" id="char-3" class="character" alt="FAE 4">
    </div>

    <!-- 號碼卡片區 -->
    <div class="cards-container">
      <div class="card" id="card-0">
        <h2>1</h2>
        <p>FAE ①</p>
      </div>
      <div class="card" id="card-1">
        <h2>2</h2>
        <p>FAE ②</p>
      </div>
      <div class="card" id="card-2">
        <h2>3</h2>
        <p>FAE ③</p>
      </div>
      <div class="card" id="card-3">
        <h2>4</h2>
        <p>FAE ④</p>
      </div>
    </div>

    <!-- 控制區 -->
    <div class="control-panel">
      <button class="draw-btn" id="drawBtn" onclick="startDraw()">🎰 開始抽籤</button>
      <div class="result-text" id="resultText">等待抽籤...</div>
    </div>
  </div>
